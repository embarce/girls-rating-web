# 生产静态托管配置（挂到 /etc/nginx/conf.d/app.conf，属于 http 上下文）
# 注意：location 里不要再写 add_header，否则会覆盖 server 级的安全响应头

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/manifest+json image/svg+xml;

    # ---------- 带内容哈希的构建产物：一年强缓存 ----------
    location /assets/ {
        expires    1y;
        access_log off;
        try_files  $uri =404;
    }

    # ---------- 图片等静态资源 ----------
    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|ico|woff2?)$ {
        expires    30d;
        access_log off;
        try_files  $uri =404;
    }

    # ---------- 入口 HTML 不缓存，发版即时生效 ----------
    location = /index.html {
        expires -1;
    }

    # ---------- 容器健康检查 ----------
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return       200 "ok\n";
    }

    # ---------- 路由 ----------
    # 站点没有前端路由，未知路径应当老实返回 404，而不是统统回 index.html，
    # 否则任意垃圾 URL 都会以 200 + 首页内容响应（软 404 / 重复内容）。
    # 若以后接入客户端路由，再改回：try_files $uri $uri/ /index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # ---------- 可选：同域反向代理后端 ----------
    # 前端固定请求 /api，若后端与前端同域，放开下面一段并把 backend:8080 换成实际地址
    # location /api/ {
    #     proxy_pass         http://backend:8080;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
